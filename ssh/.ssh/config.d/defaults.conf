# Client-agnostic SSH defaults — managed by dotfiles (stow package: ssh).
# Machine-specific hosts stay in the untracked ~/.ssh/config, which pulls
# this in via:  Include config.d/*.conf
#
# SSH uses the first value seen for each option, so these Host * defaults
# apply everywhere unless a host block earlier in ~/.ssh/config overrides them.

Host *
    # Detect dead connections (laptop sleep, Wi-Fi drop, unclean disconnect)
    # within ~90s so the client tears down instead of leaving ghost sessions.
    ServerAliveInterval 30
    ServerAliveCountMax 3
